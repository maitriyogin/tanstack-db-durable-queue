query getTodos {
  todos {
    id
    name
    description
    status
    createdAt
    updatedAt
  }
}

query getTodo($id: ID!) {
  todo(id: $id) {
    id
    name
    description
    status
    createdAt
    updatedAt
  }
}

mutation createTodo($input: CreateTodoInput!) {
  createTodo(input: $input) {
    id
    name
    description
    status
    createdAt
    updatedAt
  }
}

mutation updateTodo($input: UpdateTodoInput!) {
  updateTodo(input: $input) {
    id
    name
    description
    status
    createdAt
    updatedAt
  }
}

mutation deleteTodo($id: ID!) {
  deleteTodo(id: $id) {
    id
    name
    description
    status
    createdAt
    updatedAt
  }
}
